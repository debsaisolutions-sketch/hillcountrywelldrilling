name: Lead form checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbidden placeholders and local assets
        run: python3 scripts/check-lead-forms.py
      - name: Mocked lead submit
        run: node scripts/test-tdp-leads.mjs
